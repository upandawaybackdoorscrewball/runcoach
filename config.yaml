# ── Model provider ────────────────────────────────────────────────────
# Replace the placeholders with your provider. See README.md "Filling in placeholders".
# Examples: provider openrouter + model anthropic/claude-sonnet-4.5 + base_url https://openrouter.ai/api/v1
#           provider openai-codex (OAuth via `hermes auth`) + model gpt-5.x + base_url https://chatgpt.com/backend-api/codex
model:
  default: {{MODEL}}
  provider: {{MODEL_PROVIDER}}
  base_url: {{MODEL_BASE_URL}}
# Optional automatic failover. Delete this list to disable, or fill in one or more entries.
fallback_providers:
  - provider: {{FALLBACK_PROVIDER}}
    model: {{FALLBACK_MODEL}}
    base_url: {{FALLBACK_BASE_URL}}
    api_mode: chat_completions
toolsets:
  - hermes-cli
  - hermes-telegram
  - vision
  - web
  - file
  - memory
  - session_search
  - skills
  - cronjob
  - messaging
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 180
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 180
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
terminal:
  backend: docker
  modal_mode: auto
  cwd: ${COACH_VAULT}
  timeout: 180
  env_passthrough:
    - STRAVA_CLIENT_ID
    - STRAVA_CLIENT_SECRET
    - STRAVA_REFRESH_TOKEN
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env:
    - STRAVA_CLIENT_ID
    - STRAVA_CLIENT_SECRET
    - STRAVA_REFRESH_TOKEN
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  vercel_runtime: node24
  container_cpu: 2.0
  container_memory: 6144
  container_disk: 51200
  container_persistent: true
  docker_volumes:
    # host vault directory : in-container path. COACH_VAULT defaults to /wiki (see README).
    - ${COACH_VAULT_HOST}:${COACH_VAULT}:rw
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true
web:
  backend: ''
  search_backend: ''
  extract_backend: ''
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
  dialog_timeout_s: 300
  camofox:
    managed_persistence: false
    user_id: ''
    session_key: ''
    adopt_existing_tab: false
checkpoints:
  enabled: false
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
  delete_orphans: true
file_read_max_chars: 100000
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  hygiene_hard_message_limit: 400
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
openrouter:
  response_cache: true
  response_cache_ttl: 300
  min_coding_score: 0.65
bedrock:
  region: ''
  discovery:
    enabled: true
    provider_filter: []
    refresh_interval: 3600
  guardrail:
    guardrail_identifier: ''
    guardrail_version: ''
    stream_processing_mode: async
    trace: disabled
auxiliary:
  vision:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
    download_timeout: 30
  compression:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
  skills_hub:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  approval:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  mcp:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  title_generation:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
  triage_specifier:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 120
  curator:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 600
  web_extract:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 360
  session_search:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
    timeout: 30
    extra_body: {}
    max_concurrency: 3
display:
  compact: false
  personality: ''
  resume_display: full
  busy_input_mode: interrupt
  tui_auto_resume_recent: false
  bell_on_complete: false
  show_reasoning: false
  streaming: false
  timestamps: false
  final_response_markdown: strip
  persistent_output: true
  persistent_output_max_lines: 200
  inline_diffs: true
  file_mutation_verifier: true
  show_cost: false
  skin: default
  language: en
  tui_status_indicator: kaomoji
  user_message_preview:
    first_lines: 2
    last_lines: 2
  interim_assistant_messages: true
  tool_progress_command: false
  tool_preview_length: 0
  ephemeral_system_ttl: 0
  runtime_footer:
    enabled: false
    fields:
      - model
      - context_pct
      - cwd
  copy_shortcut: auto
  pet:
    enabled: false
    slug: cash-cuy
  tool_progress: all
dashboard:
  theme: default
  show_token_analytics: false
privacy:
  redact_pii: false
tts:
  provider: edge
  edge:
    voice: {{TTS_EDGE_VOICE}}  # e.g. an Edge neural voice name
  elevenlabs:
    voice_id: {{TTS_ELEVENLABS_VOICE_ID}}
