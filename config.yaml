  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  xai:
    voice_id: eve
    language: en
    sample_rate: 24000
    bit_rate: 128000
  mistral:
    model: voxtral-mini-tts-2603
    voice_id: {{TTS_MISTRAL_VOICE_ID}}
  neutts:
    ref_audio: ''
    ref_text: ''
